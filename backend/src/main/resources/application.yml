server:
  port: 8080

spring:
  application:
    name: elearning-cloud
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/elearning}
    username: ${DB_USERNAME:elearning}
    password: ${DB_PASSWORD:elearning123}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
