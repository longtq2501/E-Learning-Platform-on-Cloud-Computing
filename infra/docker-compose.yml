version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: elearning-postgres
    environment:
      POSTGRES_DB: elearning
      POSTGRES_USER: elearning
      POSTGRES_PASSWORD: elearning123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning -d elearning"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elearning-net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: elearning-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elearning-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: elearning-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/elearning
      DB_USERNAME: elearning
      DB_PASSWORD: elearning123
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      JWT_SECRET: ${JWT_SECRET:-bXktdmVyeS1zZWN1cmUtc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTI1Ni1iaXRz}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - elearning-net
    restart: on-failure

volumes:
  postgres_data:
  minio_data:

networks:
  elearning-net:
    driver: bridge
