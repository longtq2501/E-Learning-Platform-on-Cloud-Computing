x-backend-environment: &backend-environment
  DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-elearning}
  DB_USERNAME: ${POSTGRES_USER:-elearning}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-elearning123}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in infra/.env}
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}

x-backend-common: &backend-common
  build:
    context: ../backend
    dockerfile: Dockerfile
  expose:
    - "8080"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
    interval: 10s
    timeout: 5s
    start_period: 30s
    retries: 5
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  networks:
    - elearning-net
  restart: on-failure

services:
  postgres:
    image: postgres:16-alpine
    container_name: elearning-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elearning}
      POSTGRES_USER: ${POSTGRES_USER:-elearning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elearning123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elearning-net

  minio:
    image: quay.io/minio/minio:latest
    container_name: elearning-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elearning-net

  backend-1:
    <<: *backend-common
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-1

  backend-2:
    <<: *backend-common
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-2

  backend-3:
    <<: *backend-common
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-3

  nginx:
    image: nginx:1.27-alpine
    container_name: elearning-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    networks:
      - elearning-net
    restart: on-failure

volumes:
  postgres_data:
  minio_data:

networks:
  elearning-net:
    driver: bridge